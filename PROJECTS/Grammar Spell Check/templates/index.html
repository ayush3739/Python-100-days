<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stock Dashboard Mock</title>
<link rel="stylesheet" href="../static/style.css">
</head>
<body>

<header>📊 Stock Dashboard</header>

<div class="container">
    
    <div class="sidebar">
        <h3>Watchlist</h3>
        <div class="watch-item">AAPL</div>
        <div class="watch-item">TSLA</div>
        <div class="watch-item">MSFT</div>
        <div class="watch-item">AMZN</div>
        <div class="watch-item">RELIANCE.BSE</div>
    </div>

    <div class="main">

        <div class="search-box">
            <input type="text" placeholder="Enter stock symbol e.g. AAPL">
            <button>Search</button>
        </div>

        <div class="info-box">
            <div><strong>Symbol:</strong> AAPL</div>
            <div><strong>Price:</strong> $172.14</div>
            <div><strong>Change:</strong> +1.45%</div>
            <div><strong>Volume:</strong> 58M</div>
        </div>

        <div class="chart-box">
            <div class="chart-title">Price (Daily)</div>
            <div class="placeholder"></div>
        </div>
        
        <div class="chart-box">
            <div class="chart-title">Volume</div>
            <div class="placeholder"></div>
        </div>

    </div>
</div>

</body>
</html>
