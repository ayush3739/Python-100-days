{% extends "base.html" %} {% block content %}

<div class="box">
  <h1>Flask Authentication</h1>
  <!-- TODO: Hide the Login/Registration buttons for logged-in users -->
   {% if not logged_in: %}

  <a href="{{ url_for('login') }}" class="btn btn-primary btn-block btn-large"
    >Login</a
  >
  <a
    href="{{ url_for('register') }}"
    class="btn btn-secondary btn-block btn-large"
    >Register</a
  >
  <!-- Feedback for logged-in users -->
  {% else %}
    <p>(You are logged In)</p>
    <p style="color: white;">Go to the secret content page or logout!!</p>
    <a href="{{ url_for('secrets') }}" class="btn btn-primary btn-block btn-large">Secret page link</a>
  {% endif %}
</div>

{% endblock %}
